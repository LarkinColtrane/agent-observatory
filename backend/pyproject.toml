[project]
name = "agent-observatory-backend"
version = "0.1.0"
description = "Agent Observatory backend service (Phase 1 engineering foundation)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "bandit>=1.7.10",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatory"]

[tool.uv]
# Reproducibility: never resolve versions younger than the cutoff (ADR-0002/0005).
exclude-newer = "2026-09-25T00:00:00Z"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# PGH004: no blanket "# noqa"; RUF100 (via RUF): no unused noqa (review R-B-006-02).
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "PT", "SIM", "PL", "TID", "PGH004"]
ignore = ["PLR2004"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Review P1A-08 note: constructing Settings directly bypasses the sanitized
# ConfigurationError path (pydantic errors() would carry raw inputs).
"observatory.core.config.Settings".msg = "use observatory.core.config.get_settings() (sanitized errors)"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913", "TID251"]
"migrations/**" = ["S"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["observatory"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: requires real PostgreSQL and Redis (AO_TEST_DATABASE_URL / AO_TEST_REDIS_URL)"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["observatory"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "observatory"

[[tool.importlinter.contracts]]
name = "Layered architecture (ADR-0005 §2)"
type = "layers"
layers = [
    "observatory.main",
    "observatory.api | observatory.db | observatory.cache",
    "(observatory.events)",  # optional until AO-P2-003 creates it (ADR-0008 §17)
    "observatory.core",
]
containers = []
exhaustive = false

[[tool.importlinter.contracts]]
name = "api, db and cache are independent; only main composes (ADR-0005 §2)"
type = "independence"
modules = ["observatory.api", "observatory.db", "observatory.cache"]
