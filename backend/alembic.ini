# Alembic configuration (ADR-0005 §3).
#
# The database URL is NOT configured here: migrations/env.py reads
# AO_MIGRATION_DATABASE_URL (the DDL/owner role) via get_settings() and refuses
# to run if sqlalchemy.url is set in this file. Never add credentials here.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
revision_environment = false
path_separator = os

# Logging is configured by migrations/env.py via observatory.core.logging
# (redacting handler); there is intentionally no logging section here.
