# Pre-commit hooks for agent-observatory (see docs/phase-quality-gates.md).
# Repository hygiene, secret scanning, governance, and backend Ruff (pinned to
# the version in backend/uv.lock; config from backend/pyproject.toml). mypy,
# import-linter, ESLint, tsc and Prettier need the locked project
# environments, so they run in CI (governance.yml) and `make check`.
# Revs are pinned to commit SHAs (tags are mutable, review N-04); update
# deliberately via a reviewed change.
minimum_pre_commit_version: "3.5.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # frozen: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 43fae355e6fe4d99d2a7b240a224b85e2903aeb4 # frozen: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd # frozen: v0.16.9 (= backend/uv.lock)
    hooks:
      - id: ruff
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: governance-check
        name: governance check
        entry: python3 -I scripts/check-governance.py
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        pass_filenames: false
        always_run: true
      - id: governance-checker-tests
        name: governance checker adversarial tests
        entry: python3 -I -m unittest discover -s tests/governance -t . -q
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        pass_filenames: false
        files: ^(scripts/check-(governance|artifacts)\.py|tests/governance/|docs/phases/P[0-9]+-tasks/|\.github/workflows/)
