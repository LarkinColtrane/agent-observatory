# Pre-commit hooks for agent-observatory (see docs/phase-quality-gates.md).
# Only repository-hygiene, secret-scanning and governance hooks exist at this
# stage. Python/TypeScript hooks (ruff, mypy, eslint, tsc, prettier) are added
# in Phase 1 together with the source trees they check (ADR-0002, TD-001).
# Revs are pinned to commit SHAs (tags are mutable, review N-04); update
# deliberately via a reviewed change.
minimum_pre_commit_version: "3.5.0"
# Practice-repository files are not part of agent-observatory and must never be
# modified by hooks (review N-02). Remove this line after migration (ADR-0004).
exclude: ^(README\.md|test\.txt|test2\.text|Result\.txt)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # frozen: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 43fae355e6fe4d99d2a7b240a224b85e2903aeb4 # frozen: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: governance-check
        name: governance check
        entry: python3 -I scripts/check-governance.py
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        pass_filenames: false
        always_run: true
      - id: governance-checker-tests
        name: governance checker adversarial tests
        entry: python3 -I -m unittest discover -s tests/governance -t . -q
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        pass_filenames: false
        files: ^(scripts/check-governance\.py|tests/governance/)
