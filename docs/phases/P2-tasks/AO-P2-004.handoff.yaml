summary: >
  The 16 §8 payload models (closed, strict, frozen, no defaults or nulls) replace
  the AO-P2-003 placeholders in observatory.events.taxonomy. The registry
  dispatch is kept. Cross-field rules raise one error at the smallest violated
  field; required-scope rules run against the event scope (check 13); the
  listed self references are invalid_reference with exact pointers (check 14).
  usage.recorded reuses the exact ADR-0007 UsageMetrics, with the §9 rules and
  a pinned ISO 4217 allowlist. Extension vendors cannot be denylisted words or
  core family names. The informative JSON Schema is generated deterministically
  and pinned by a golden test.
