risks_and_open_questions:
  - >
    Proposed TD-030 (low, C1, owner reviewer-a): the event JSON key-name
    secret test uses ADR-0005 is_secret_key only. C20's "normalised name ends
    in pwd" rule applies only to text-tier key/value pairs. So an extension key
    such as MYSQL_PWD or db_pwd with a plain (not credential-shaped) value is
    accepted, while "MYSQL_PWD=<value>" in text is secret_detected.
    Suggested repayment: a secret-rules patch (SECRET_RULES_VERSION 2, ADR-0008
    section 16 security exception, Reviewer A sign-off) that applies the
    text-tier secret-name rule to JSON keys. Until then, Reviewer A rejects
    *pwd extension keys in P3 adapter review. The coordinator should register
    it and decide whether it blocks P3 or P11. It does not block P2.
  - Item 9 covers only the protocol's own failure modes; there is no running event service until P4 (P2 plan).
  - core.logging masks secret-named keys and URL userinfo (ADR-0005 section 3) but not bare credential-shaped tokens in log text. This is unchanged since P1 and is not a regression. The owner may consider adopting the event credential tier in logs.
  - Item 6 rests on the CI containers job (images not built locally). npm audit signatures ran only in CI.
