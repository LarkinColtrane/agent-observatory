summary: >
  Three SYNTHETIC provider shapes (A transcript JSONL, B orchestrator webhooks,
  C minimal Python agent steps) and test-only mappers map one shared scenario to
  ADR-0008 events. Their projections (event_type, scope, payload) are equal on the
  overlap: A and C share 10 events, B and C share 10, and the two agent.spawned
  events are common to all three. Ids, time and provenance differ as §§4 and 6
  require. The reference trace reference-trace-v1.jsonl (58 canonical events, 5
  agents) is generated deterministically and pinned by SHA-256
  6443d5f78ac0397c46dd5e514c675f8a82bd2dac7253b06563bb74663d96dbd8. Golden events
  pin canonical bytes and fingerprints as literals. Seeded property tests and an
  adversarial suite run through the bytes path.

  A-001 evidence, provider fields each shape cannot map:
  - A: assistant text blocks, thinking blocks, the Task prompt, tool_result text,
    Write file bodies (only the line count is kept), toolUseResult stdout/stderr,
    costUSD (a binary float, never money), service_tier, requestId, the
    parentUuid chain (a conversation link, not a cause), isSidechain, client
    version, the Bash description, per-call durations, and the Task call itself
    (emitted only as agent.spawned). cwd is used only to relativise paths.
  - B: delivery_id, the signature header (authentication is ingestion's), the
    delivery attempt count, task description, priority and estimate_hours, the
    agent e-mail, and review comment text.
  - C: source times (occurred_at stays absent), every id (the SDK assigns stream,
    seq, UUIDv7 and message ids), the exception traceback (only an error code
    and a sanitised message are kept), and the message note (message.sent
    carries no content).
