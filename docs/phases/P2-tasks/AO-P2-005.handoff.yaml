risks_and_open_questions:
  - "Reading taken: §4 qualifies entity ids by provider, so the projection is compared with the '<provider>:' prefix removed. The shapes share native entity names (agents, tasks, call handles) by construction."
  - "tests/fixtures has no __init__.py, because it is outside the claim. tests.fixtures.events imports as part of an implicit namespace package. Adding tests/fixtures/__init__.py later is harmless."
  - "The reference trace is pinned twice: in the .sha256 file and as PINNED in test_reference_trace.py. Regenerating it requires updating both, which is deliberate."
  - "A gitleaks working-tree scan (--working-tree) reports synthetic values in untracked .pytest_cache and __pycache__ files (parametrize ids, constant-folded pyc). These files are gitignored, and the behaviour predates this task (test_telemetry)."
