summary: >
  Fixes every accepted AO-P2-006 finding and implements ADR-0008 amendments
  C14-C26, starting from p2/003-integration at 160eb38.

  The events text tier is rewritten:
  - a value counts as already redacted only when it is exactly [REDACTED];
    any other value starting with it is masked whole (C18);
  - quoted values run to their closing quote or to the end of the string (C19);
  - CLI coverage is extended as C20 lists, linearly, with one key/value scan
    and one shell-like tokenisation per string (C20);
  - every check also runs on the stripped form (C21).

  core.logging applies C18 and exposes normalize_key. Event and RecordedEvent
  validation is strict whatever strict= the caller passes, and the JSON and
  string entry points raise (C22). The recorded-rules override is private and
  token-bound (C23). Importing the package asserts Unicode 15.0.0, and the
  envelope documents that events are process-local (C24).

  Further changes:
  - currency list: 164 codes, adding XAF, XCD, XCG, XOF and XPF (C16);
  - informative schema: event_type admits extension types (C26);
  - the 16 payload models are re-exported;
  - the C13 projection strips the provider prefix only at Id positions;
  - the reference trace is regenerated: dependants complete after their
    dependencies, the coordinator terminates last, and one event has no
    stream and no occurred_at.

  The commit ids in the AO-P2-003, -004 and -005 handoffs (79a80dd, 557ed0d,
  b88d93e) refer to my pre-squash task branches. All three were squashed into
  918050c on p2/003-integration, and each of those handoffs now says so
  (R-B-P2-006-12(d)).
