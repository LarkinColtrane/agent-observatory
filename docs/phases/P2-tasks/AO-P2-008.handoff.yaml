risks_and_open_questions:
  - "The events key/value scan is now implemented in events/text.py instead of calling core.logging.mask_key_values. C19 and C20 widen it for events only, while ADR-0005 logging takes only C18. Both use ADR-0005's is_secret_key and normalize_key."
  - "A word that embeds an option after a path ('/abs/--token x') is no longer an option match, because options are whole shell words. The kv scan still covers '--token=x' anywhere. I changed one test input to the shell-realistic form."
  - "C21: sanitize_text falls back to the NFKC of the stripped form when only that form shows a hit, so in that case its output loses the forbidden characters."
  - "Reviewer A probe p10 imports the removed public recorded_rules, so it no longer runs. The C23 negative test replaces it."
