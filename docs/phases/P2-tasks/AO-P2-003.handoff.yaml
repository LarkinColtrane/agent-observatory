risks_and_open_questions:
  - The rules stamp is an in-process HMAC with a per-process random key. It stops forgery through the public API, but not code that reads module internals. Python has no stronger privacy.
  - Construction rejects explicit None everywhere (rule 4), so Event.model_validate(event.model_dump()) fails. Use model_dump(exclude_none=True) or canonical_json.
  - Check 15 cannot be reached with v1-sized valid events (about 13 KiB at most), so it is tested by lowering the limit.
  - "AO-P2-004 hooks: add models to payloads.PAYLOADS and override EventPayload.reference_errors(event). Scope-requirement rules (§8 'Required scope') need a schema hook; none exists yet."
