summary: >
  observatory.events implements ADR-0008 sections 2-7 and 10-17 with
  clarifications C0-C8 (5894c26) and the reviewers' C3/C4 sign-off notes.
  Constructing an Event in any way runs checks 9-15. Each instance carries a
  private stamp: the rules version it was validated under, bound by HMAC to its
  canonical bytes, so the pure functions re-validate it under that version.
  Forged, mutated, re-stamped and subclassed instances fail closed. The payload
  registry dispatches on (spec_version, event_type). session.started,
  file.changed and usage.recorded are minimal placeholders that AO-P2-004
  replaces.
