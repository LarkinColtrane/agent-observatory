# Machine-readable governance state for agent-observatory.
# Coordinator-owned (docs/development-operating-contract.md §4).
# Validated by scripts/check-governance.py — the checker also hard-codes the
# canonical phase order (ADR-0003), so reordering phases requires a reviewed
# change to the checker itself.
schema_version: 1
project: agent-observatory

repository:
  dedicated: true                       # migrated and verified 2026-10-10 (TD-002 repaid)
  required_owner: LarkinColtrane
  required_name: agent-observatory
  required_visibility: public          # made public 2026-10-10 (owner)
  current_location: >
    github.com/LarkinColtrane/agent-observatory (public since 2026-10-10), default branch main.
    Migration provenance: docs/migration-provenance.md.

# Phase statuses: not_started | in_progress | gate_review | closed
# blocked_by: open debt ids whose `blocks` list includes this phase.
phases:
  - id: P0
    name: Governance
    status: closed
    plan: docs/phases/P0-plan.md
    gate_report: docs/phases/P0-gate-report.md
    approved_not_applicable: [1, 3, 4, 6, 7, 9]
    gate_tag: phase-P0-v1.1.0           # annotated, -> 8ce0ed3; published 2026-10-10 via owner-authorized bootstrap workflow
    review_record: docs/reviews/pre-phase-1-review-resolution.md
    blocked_by: []
  - id: P1
    name: Engineering foundation
    status: in_progress
    plan: docs/phases/P1-plan.md
    blocked_by: []
  - {id: P2, name: Universal agent event protocol, status: not_started, blocked_by: [TD-001]}
  - {id: P3, name: Adapter / SDK layer, status: not_started, blocked_by: []}
  - {id: P4, name: Agent state engine, status: not_started, blocked_by: []}
  - {id: P5, name: Realtime observability, status: not_started, blocked_by: []}
  - {id: P6, name: Operations dashboard, status: not_started, blocked_by: []}
  - {id: P7, name: Analytics / scorecards, status: not_started, blocked_by: []}
  - {id: P8, name: 2D virtual office, status: not_started, blocked_by: []}
  - {id: P9, name: External integrations, status: not_started, blocked_by: []}
  - {id: P10, name: Control room / workflow graph, status: not_started, blocked_by: []}
  - {id: P11, name: Production hardening, status: not_started, blocked_by: []}

components:
  - {id: C1, name: Event protocol}
  - {id: C2, name: Adapter SDK}
  - {id: C3, name: Adapters}
  - {id: C4, name: Ingestion}
  - {id: C5, name: Event store}
  - {id: C6, name: State engine}
  - {id: C7, name: Query API}
  - {id: C8, name: Operations dashboard}
  - {id: C9, name: Control room / workflow graph}
  - {id: C10, name: 2D virtual office}
  - {id: C11, name: Platform & tooling}
  - {id: C12, name: Governance}
  - {id: C13, name: Identity & access}
  - {id: C14, name: Realtime}
  - {id: C15, name: Analytics / scorecards}
  - {id: C16, name: External integrations}

# Contract statuses: not_drafted | draft | in_review | approved | frozen | deprecated
# approved/frozen require: existing path, semver version, reviewed_by both
#   reviewers, and a review_record whose recorded final verdicts are approvals.
# frozen additionally requires tag `contract-<id>-v<version>` to exist as an
#   annotated git tag (created in the dedicated repository only).
# not_before_phase: status must stay not_drafted until that phase has started;
#   the checker hard-codes event-protocol -> P2 (ADR-0003).
contracts:
  - id: operating-contract
    review_record: docs/reviews/pre-phase-1-review-resolution.md
    path: docs/development-operating-contract.md
    version: 1.1.0
    status: approved
    reviewed_by: [reviewer-a, reviewer-b]
    tag: null
  - id: task-contract
    review_record: docs/reviews/pre-phase-1-review-resolution.md
    path: docs/agent-task-contract.md
    version: 1.1.0
    status: approved
    reviewed_by: [reviewer-a, reviewer-b]
    tag: null
  - id: handoff-contract
    review_record: docs/reviews/pre-phase-1-review-resolution.md
    path: docs/agent-handoff-contract.md
    version: 1.1.0
    status: approved
    reviewed_by: [reviewer-a, reviewer-b]
    tag: null
  - id: phase1-foundation
    review_record: docs/reviews/phase-1-contract-review.md
    path: docs/adr/0005-phase-1-foundation-contract.md
    version: 1.0.0
    status: frozen
    reviewed_by: [reviewer-a, reviewer-b]
    tag: contract-phase1-foundation-v1.0.0
  - id: event-protocol
    path: null
    version: null
    status: not_drafted
    not_before_phase: P2
  - id: adapter-interface
    path: null
    version: null
    status: not_drafted
    not_before_phase: P3
  - id: query-api
    path: null
    version: null
    status: not_drafted
    not_before_phase: P4

# Active path claims (coordinator records at assignment, releases at integration).
# Each: {task: AO-P<n>-<seq>, owner: <agent>, paths: [<path prefix>, ...]}
claims:
  # AO-P1-001 released on merge of PR #3 (a8ea522).
  - {task: AO-P1-002, owner: w1-backend-core, paths: [backend/src/observatory/core/logging.py, backend/src/observatory/core/errors.py, backend/src/observatory/api, backend/tests/unit]}
  - {task: AO-P1-003, owner: w2-frontend, paths: [frontend]}
  - {task: AO-P1-004, owner: w3-data-containers, paths: [backend/src/observatory/db, backend/src/observatory/cache, backend/migrations, backend/alembic.ini, backend/tests/integration, backend/Dockerfile, backend/.dockerignore, compose.yaml, compose.env.example, deploy/postgres]}
  - {task: AO-P1-005, owner: w4-governance-tooling, paths: [scripts/check-artifacts.py, tests/governance/test_check_artifacts.py, tests/governance/test_workflow.py, docs/phases/P1-tasks]}

# Annotated tags to be created by .github/workflows/release-tags.yml on main
# (ADR-0005 §7). Entries stay as the audit record; existing tags are never moved.
pending_tags:
  - tag: contract-phase1-foundation-v1.0.0
    commit: self
    message: Agent Observatory Phase 1 engineering-foundation contract (ADR-0005) v1.0.0, approved by Reviewer A and Reviewer B.
