# Assumption register for agent-observatory.
# Every assumption the project builds on. Invalidated assumptions trigger review
# of every component listed in `affects`. Entries are never deleted.
#
# status: open | validated | invalidated
# confidence: low | medium | high
# affects: component ids from governance-state.yaml, or "all"
# review_phase: the phase by which the assumption must be validated/invalidated
schema_version: 2
assumptions:
  - id: A-001
    statement: >
      A single universal event protocol can represent the activity of
      heterogeneous agent systems (tool calls, messages, task lifecycle,
      handoffs) without losing information needed for observability.
    confidence: medium
    status: open
    owner: coordinator
    affects: [C1, C2, C3, C6]
    review_phase: P3
    validation_plan: >
      Phase 2 (not earlier, ADR-0003): map at least two structurally different
      agent systems onto the draft protocol before freezing it; record
      unmappable fields; adversarial review by both reviewers.
    recorded: 2026-10-10
    history:
      - 2026-10-12: P2 evidence (AO-P2-005) — three structurally different synthetic shapes (a Claude/Codex-like transcript, generic orchestrator webhooks, a minimal custom agent) map to the same canonical projection; the unmappable fields are listed in docs/phases/P2-tasks/AO-P2-005.handoff.yaml and are almost all content deliberately excluded by ADR-0008 section 10.4. Still open because the shapes are synthetic; to be validated against real provider data by the P3 adapters (review_phase moved to P3).
    history:
      - 2026-10-10: validation re-targeted from Phase 1 to Phase 2 (ADR-0003, review B-05/A-04).

  - id: A-002
    statement: >
      Agent/workflow state can be derived deterministically from the event log
      alone (event sourcing), so state can always be recomputed.
    confidence: medium
    status: open
    owner: coordinator
    affects: [C5, C6]
    review_phase: P4
    validation_plan: Replay tests with out-of-order and duplicate events once C6 exists.
    recorded: 2026-10-10

  - id: A-003
    statement: >
      Adapter payloads may contain secrets and sensitive content, so redaction
      must happen at ingestion before persistence, including for quarantined
      (invalid) payloads.
    confidence: high
    status: open
    owner: reviewer-a
    affects: [C3, C4, C5]
    review_phase: P3
    validation_plan: Reviewer A review of C4 design; fixture-based redaction tests including malformed payloads.
    recorded: 2026-10-10
    history:
      - 2026-10-10: extended to quarantined payloads (review A-06).

  - id: A-004
    statement: >
      The Phase 1 stack is Python 3.12+/FastAPI/Pydantic/SQLAlchemy/Alembic,
      PostgreSQL, Redis, Next.js/React/TypeScript, Docker Compose, as a
      modular monolith.
    confidence: high
    status: validated
    owner: coordinator
    affects: [C11]
    review_phase: P1
    validation_plan: Decided by ADR-0002. Toolchains proven working by the Phase 1 L3 gate.
    recorded: 2026-10-10
    history:
      - 2026-10-10: originally "stack not yet chosen"; validated by ADR-0002 (review B-06).

  - id: A-005
    statement: >
      agent-observatory shares no code, contracts, secrets, or infrastructure
      with Quant Autonomy or any other project.
    confidence: high
    status: validated
    owner: coordinator
    affects: [all]
    review_phase: P0
    validation_plan: Confirmed by project charter; any change requires an ADR.
    recorded: 2026-10-10

  - id: A-006
    statement: >
      This governance baseline can live in the Og-Repo practice repository at
      the root `docs/` directory.
    confidence: high
    status: invalidated
    owner: coordinator
    affects: [C11, C12]
    review_phase: P0
    validation_plan: n/a — invalidated.
    recorded: 2026-10-10
    history:
      - 2026-10-10: invalidated by owner direction and ADR-0004 — project must live in a dedicated private repository (see TD-002).
      - 2026-10-10: superseded in practice — migrated to private LarkinColtrane/agent-observatory (docs/migration-provenance.md).

  - id: A-007
    statement: >
      A modular monolith with vertically scaled PostgreSQL can sustain ingest
      volume through at least Phase 10 without a streaming platform.
    confidence: medium
    status: open
    owner: reviewer-b
    affects: [C4, C5, C6]
    review_phase: P11
    validation_plan: Load tests with recorded-volume synthetic traffic in Phase 5 and Phase 11; any streaming platform requires an ADR citing measurements.
    recorded: 2026-10-10

  - id: A-008
    statement: >
      Python async (FastAPI/asyncio) throughput is sufficient for ingest and
      realtime fan-out at expected workspace sizes.
    confidence: medium
    status: open
    owner: reviewer-b
    affects: [C4, C14]
    review_phase: P5
    validation_plan: Benchmark ingest and fan-out in Phase 5 before freezing the realtime design.
    recorded: 2026-10-10
  - id: A-010
    statement: >
      A minimal security-patch release published at least 7 days before it is
      locked carries less risk than keeping the known high advisory it fixes
      (ADR-0006 exception to the 2-week dependency cutoff).
    confidence: medium
    status: open
    owner: reviewer-a
    affects: [C11]
    review_phase: P1
    validation_plan: Reviewer A and Reviewer B rule on ADR-0006 at the AO-P1-006 review; re-check at each phase gate that every recorded exception has lapsed or is still the minimal fix.
    recorded: 2026-10-11
  - id: A-011
    statement: >
      libpq/psycopg treat connect_timeout values below 2 s as 2 s, so the
      database probe's effective connect bound is 2 s (equal to the readiness
      deadline), not the 1 s named in ADR-0005 section 3; readiness stays
      fail-closed because run_checks enforces the overall deadline.
    confidence: high
    status: validated
    owner: reviewer-b
    affects: [C11]
    review_phase: P1
    validation_plan: Reviewer B observed OperationalError at 2.0 s against a black-hole server; Reviewer A observed the black-hole check completing within the readiness deadline (under 2.5 s).
    recorded: 2026-10-11
  - id: A-013
    statement: >
      Every layer that consumes event text treats it as data. Views escape
      it as plain text and show agent_id next to display_name. Markdown
      renderers render it as plain text. CSV and spreadsheet exports
      neutralise leading =, +, - and @. Any model that reads event text
      receives it as quoted data, never as instructions. The protocol keeps
      HTML, script and markup in free-text fields verbatim and rejects only
      the enumerated invisible, control and bidi characters (ADR-0008
      section 10).
    confidence: medium
    status: open
    owner: reviewer-a
    affects: [C8, C9, C10]
    review_phase: P6
    validation_plan: P6 review checks every rendering, export and model-consumption path, with XSS, Markdown and CSV-formula tests that feed the reference trace plus markup-bearing fixtures through each.
    recorded: 2026-10-12
