# Technical debt register for agent-observatory.
# Every known shortcut. Debt is never tracked only in code comments, and
# entries are never deleted: repaid debt keeps its history.
#
# severity: low | medium | high | critical
# status: open | scheduled | repaid | accepted
# component: component id from governance-state.yaml
# blocks: phases that may not open while this debt is open
schema_version: 2
debt:
  - id: TD-001
    title: Application quality tooling not yet present
    description: >
      Pre-Phase-1 cleanup added the governance/hygiene portion: pre-commit
      (hygiene hooks, gitleaks, governance check), a pinned checksum-verified
      full-history secret scan, governance CI workflow, and adversarial
      checker tests. Still missing until source trees exist: Ruff, mypy
      --strict, pytest, ESLint, tsc, Prettier, frontend tests, Docker/Compose,
      Alembic, dependency audit, SAST, import-boundary checks, product failure
      injection. These are Phase 1 deliverables.
    severity: medium
    status: open
    owner: coordinator
    component: C11
    blocks: [P2]
    repayment_trigger: Phase 1 L3 gate (all application tooling running in CI).
    recorded: 2026-10-10
    history:
      - 2026-10-10: governance/hygiene portion repaid in pre-Phase-1 cleanup; remaining scope is Phase 1 work, so it blocks P2 rather than P1.

  - id: TD-002
    title: Project not yet in its dedicated private repository
    description: >
      agent-observatory was developed on branch claude/agent-observatory-governance
      of the public practice repository LarkinColtrane/Og-Repo. ADR-0004
      required a dedicated private repository. The agent could not create it
      (GitHub App lacks repository-creation permission); the owner created
      LarkinColtrane/agent-observatory (private) and the agent migrated the
      project into it (docs/migration-provenance.md).
    severity: high
    status: repaid
    owner: project-owner
    component: C12
    blocks: [P1]
    repayment_trigger: Private repository exists; migration verified (identical trees/metadata, clean history scan, no practice files, main established and fetched back). The P0 tag is tracked by the P0 gate (item 12), not here.
    recorded: 2026-10-10
    history:
      - 2026-10-10: originally low severity "decide on dedicated repo or cleanup"; owner decided on a dedicated private repo; raised to high and made blocking for P1.
      - 2026-10-10: repayment trigger amended to drop "P0 tag pushed", which belongs to the P0 gate (post-migration review PM-03).
      - 2026-10-10: repaid — owner created private LarkinColtrane/agent-observatory; 5 project commits migrated with identical trees and metadata (docs/migration-provenance.md); pushed to main and verified by fetch; no practice-repository files or history. The P0 tag is tracked by the P0 gate (item 12), not by this item.

  - id: TD-003
    title: Governance baseline had no independent review
    description: >
      P0 was authored by the coordinator alone and recorded as closed with an
      unrun review item. Both independent reviews were completed
      (docs/reviews/pre-phase-1-review-A.md, -B.md). Repaid only when both
      reviewers' final verdicts are recorded in
      docs/reviews/pre-phase-1-review-resolution.md.
    severity: medium
    status: repaid
    owner: coordinator
    component: C12
    blocks: [P1]
    repayment_trigger: Before Phase 1 opens (was "first task of Phase 1" — corrected per review A-01).
    recorded: 2026-10-10
    history:
      - 2026-10-10: reviews done; first verification round returned REQUEST_CHANGES from both (premature "repaid" corrected, N-01/B-16).
      - 2026-10-10: repaid — final verdicts APPROVE_WITH_NOTES from Reviewer A and Reviewer B recorded; notes fixed and confirmed by the independent validation agent.

  - id: TD-004
    title: Branch protection, CODEOWNERS enforcement and repository settings not configured
    description: >
      .github/CODEOWNERS is committed, but nothing enforces it. The agent
      cannot configure repository settings: the session proxy rejects
      repository settings writes ("Repository settings writes are not
      permitted through this proxy", HTTP 403) and the Claude GitHub App lacks
      the Administration permission needed to read or write branch protection
      or rulesets ("Resource not accessible by integration", HTTP 403). The
      owner must apply the settings listed in docs/repository-settings.md.
    severity: high
    status: repaid
    owner: project-owner
    component: C11
    blocks: [P1]
    repayment_trigger: Owner applies the ruleset in docs/repository-settings.md (targets main and protection-probe, no bypass actors); an agent verifies (a) branches/main reports protected with the governance check required and (b) a direct push, a force-push and a deletion of protection-probe are each rejected. Direct pushes to main are never used as a test.
    recorded: 2026-10-10
    history:
      - 2026-10-10: repository created and migrated; settings/protection writes confirmed impossible for the agent (proxy policy + missing Administration permission).
      - 2026-10-10: verification method changed to a probe branch under the same ruleset, because the readable API cannot show admin enforcement, force-push or deletion settings (post-migration review PM-02).
      - 2026-10-10: owner authorized automation; re-tried REST (settings, rulesets, branch protection, vulnerability alerts, Actions permissions), GraphQL and gh CLI — all refused by the session proxy or unavailable; the Claude GitHub App token lacks Administration. Remains open and blocking P1 until the owner applies the ruleset and the probe-branch verification passes.
      - 2026-10-10: repaid — repository made public by the owner (rulesets enforce on GitHub Free for public repos). Ruleset main-protection (id 24851582) active, bypass list empty (current_user_can_bypass=never), targets ~DEFAULT_BRANCH + protection-probe; rules deletion, non_fast_forward, pull_request (0 approvals, thread resolution), required_status_checks governance (integration 15368 = GitHub Actions, strict). Behavioural evidence on protection-probe only — direct push and force push from the agent identity rejected ("push declined due to repository rule violations"); deletion via the Actions token rejected ("GH013 … Cannot delete this branch"); branch unchanged at 254e400; main never probed; evidence in docs/phases/P0-public-closure.md.

  - id: TD-005
    title: Secret-scan script pinned for linux x86_64 only
    description: >
      scripts/secret-scan.sh verifies a checksum for the linux_x64 gitleaks
      build only; other platforms exit with an explicit error. CI and the
      cloud dev environment are linux x86_64.
    severity: low
    status: accepted
    owner: coordinator
    component: C11
    blocks: []
    repayment_trigger: When a contributor needs to run it on another platform.
    recorded: 2026-10-10

  - id: TD-006
    title: Handoffs and task contracts are not machine-validated
    description: >
      The allowed (ran, result) combinations and required fields are
      documented but only checked for gate reports. Handoffs are YAML in
      prose; validation is manual by the receiver.
    severity: low
    status: open
    owner: coordinator
    component: C12
    blocks: []
    repayment_trigger: When the task board/handoff storage is chosen in Phase 1.
    recorded: 2026-10-10

  - id: TD-007
    title: Reviewer verdict lines are not authenticated
    description: >
      The checker requires approving final-verdict lines from both reviewers
      before review can be recorded, but it cannot tell who wrote a line; a
      pasted verdict passes (Reviewer A, verification round 2). Mitigation
      now: every verdict line links to the reviewer's own report file.
      Related limit (PM-04): the required governance check runs the PR's own
      copy of the checker and workflow, so with 0 required approvals a PR
      could weaken the checker and pass itself; only independent review
      (policy) prevents that until a second reviewer identity exists.
      Enforcement requires CODEOWNERS + branch protection so verdict/record
      changes need the reviewer's approval (TD-004).
    severity: low
    status: open
    owner: coordinator
    component: C12
    blocks: []
    repayment_trigger: A second reviewer identity exists and the ruleset requires 1 approval (plus Code Owner review) on governance paths.
    recorded: 2026-10-10
    history:
      - 2026-10-10: partially mitigated — main is now protected (PR + governance check required, no direct or force pushes), so verdict records can only change through a reviewed, CI-checked PR. Still open because, with 0 required approvals and agents acting as the owner identity, GitHub does not authenticate who wrote a verdict, and the PR's own checker copy runs. Trigger changed from "with TD-004" because TD-004's repayment does not by itself authenticate verdicts.

  - id: TD-008
    title: No license — publication terms undecided
    description: >
      The repository is public without a LICENSE file, so by default no one
      has rights to use, modify or redistribute the content (GitHub's terms
      only allow viewing and forking on GitHub). Choosing a license is an
      owner decision; the agent must not add one without it.
    severity: medium
    status: open
    owner: project-owner
    component: C12
    blocks: []
    repayment_trigger: Owner chooses a license (or records an explicit decision to remain unlicensed).
    recorded: 2026-10-10

