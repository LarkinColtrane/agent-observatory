    severity: low
    status: open
    owner: coordinator
    component: C12
    blocks: []
    repayment_trigger: Root README, SECURITY.md (with private vulnerability reporting) and CONTRIBUTING.md added via reviewed PR; owner decision on the project-name mention recorded.
    recorded: 2026-10-10

