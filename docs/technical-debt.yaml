  - id: TD-022
    title: Log redaction hides agent usage metrics such as prompt_tokens
    description: >
      ADR-0005 section 3 makes any key containing "token" secret, so
      prompt_tokens, completion_tokens, max_tokens and tokenizer are redacted
      in logs (review R-A-002-205). Safe, but it hides metrics an agent
      observatory needs once usage data flows through the system.
    severity: low
    status: repaid
    owner: coordinator
    component: C11
    blocks: [P2]
    repayment_trigger: A superseding ADR (before the P2 event protocol freezes) defines a narrow exemption, e.g. keys ending in _tokens or token_count with integer values, implemented and tested in core.logging.
    recorded: 2026-10-11
    history:
      - 2026-10-12: repaid by AO-P2-001 — ADR-0007 replaces the suggested key-pattern exemption with a typed allowlist (owner decision at P2 kickoff) — only an exact, re-validated observatory.core.telemetry.UsageMetrics passed as a structured field survives redaction; SECRET_KEY_PARTS and scrub_text are unchanged. Evidence is backend/tests/unit/test_telemetry.py (numeric usage survives JSON and console output; credential-shaped values under token keys, nested secrets, secret-named wrapper keys, UsageMetrics and Money subclasses, model_construct, mutated and tampered objects on every log path, string/bool/float/negative/huge numbers all stay redacted or are rejected) and Reviewer A and B sign-off in docs/reviews/phase-2-reviews.md.
  - id: TD-012
    title: Log text scrubber misses a few rare key/value shapes
    description: >
      Reviewer A round 3 (R-A-002-301..304) found remaining best-effort gaps
      in core.logging's text scrubber: column-aligned values with four or more
      spaces around the separator, JSON-escaped keys inside strings
      (\"password\": ...), PGP private key blocks, and a value that already
      begins with [REDACTED]. Documented limits also include scheme-less
      user:pw@host, CLI --password X, URL-encoded password%3DX, pydantic
      input_value and unquoted values containing spaces. Structured (key-based)
      redaction is unaffected. Over-masking (not a leak): a secret-named
      setting followed by a colon makes the next word its "value", so the
      ConfigurationError "AO_DATABASE_URL: password must be percent-encoded" is
      logged as "AO_DATABASE_URL: [REDACTED] must be percent-encoded" (P1 gate;
      cause per R-A-P1-01). Fix by rewording those messages without a
      "<SETTING>:" prefix; the scrubber stays as is.
    severity: low
    status: open
    owner: coordinator
    component: C11
    blocks: [P3]
    repayment_trigger: The four shapes in R-A-002-301..304 are masked with linear-time patterns and tests, before adapters (P3) start sending third-party text into logs.
    recorded: 2026-10-11
  - id: TD-023
    title: Readiness failures log once per caller during an outage
    description: >
      Single-flight bounds probes to one per service, but every /readyz caller
      sharing a failed probe still logs a full traceback through run_checks.
      /readyz is unauthenticated, so log volume grows with request concurrency
      while the database is down (review R-A-006-04: 210 calls in 40 s produced
      455 log lines; no secrets).
    severity: low
    status: open
    owner: coordinator
    component: C11
    blocks: [P11]
    repayment_trigger: A shared probe failure is logged once per probe (sharing callers return ok=False silently) or /readyz is rate-limited, with a test bounding log lines per outage window.
    recorded: 2026-10-12
  - id: TD-024
    title: A failed readiness probe resets the pool shared with application queries
    description: >
      main.py disposes the whole engine pool after a failed or timed-out
      database probe so stalled idle connections are dropped (R-A-006-01). With
      application traffic, a slow-but-alive database would drop idle
      connections every readiness window and force reconnects under load
      (reviews R-A-006-05, R-B-006-05). Checked-out connections and in-flight
      transactions are unaffected. Phase 1 has no application queries.
    severity: medium
    status: open
    owner: coordinator
    component: C11
    blocks: [P3]
    repayment_trigger: Before the first product queries (P3), the readiness probe uses its own small engine/pool, or only the probe's connection is invalidated, or resets require N consecutive failures — with the stalled-connection recovery test still passing.
    recorded: 2026-10-12
  - id: TD-013
