  - id: TD-011
    title: GitHub secret scanning and push protection disabled
    description: >
      Now that the repository is public, GitHub secret scanning and push
      protection are available at no cost but are disabled
      (security_and_analysis, 2026-10-10). gitleaks in pre-commit and the
