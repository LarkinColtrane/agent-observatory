# TEMPORARY bootstrap workflow — owner-authorized 2026-10-10.
# Sole purpose: publish the annotated tag phase-P0-v1.1.0 -> 8ce0ed3, because
# the agent session's git proxy refuses tag pushes. Remove after one
# successful run. It has no inputs: the tag, target and message are fixed and
# cannot be changed by the caller. It never force-pushes, never touches
# branches, and refuses to run if the tag already exists.
name: bootstrap-p0-tag

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-p0-tag
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TAG: phase-P0-v1.1.0
      TARGET: 8ce0ed38198fc02fbcf14cb7a370844470567a6e
      MESSAGE: Agent Observatory reviewed Phase 0 governance baseline.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify target commit is the reviewed gate commit on main
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$TARGET")" = commit
          git merge-base --is-ancestor "$TARGET" origin/main
          git log -1 --format='%H %s' "$TARGET"

      - name: Refuse if the tag already exists remotely
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists on origin; refusing to replace it"
            exit 1
          fi

      - name: Create and push the annotated tag (no force)
        run: |
          set -euo pipefail
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$TAG" "$TARGET" -m "$MESSAGE"
          git push origin "refs/tags/$TAG:refs/tags/$TAG"

      - name: Verify remote annotated tag
        run: |
          set -euo pipefail
          refs="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          echo "$refs"
          peeled="$(echo "$refs" | awk -v r="refs/tags/$TAG^{}" '$2==r {print $1}')"
          tagobj="$(echo "$refs" | awk -v r="refs/tags/$TAG" '$2==r {print $1}')"
          test -n "$tagobj" && test "$tagobj" != "$TARGET"   # annotated: tag object differs from commit
          test "$peeled" = "$TARGET"
          echo "verified: $TAG (annotated, object $tagobj) -> $TARGET"
