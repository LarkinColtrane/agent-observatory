# TEMPORARY verification job for TD-004 (removed before merge; never on main).
# Attempts to delete ONLY refs/heads/protection-probe using the Actions token,
# which is subject to the main-protection ruleset (empty bypass list).
# The job succeeds only if GitHub REJECTS the deletion.
name: probe-deletion

on:
  pull_request:

permissions:
  contents: write

jobs:
  probe-deletion:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Attempt to delete protection-probe (must be rejected)
        run: |
          set +e   # the default shell uses -e; the push is EXPECTED to fail
          set -uo pipefail
          before="$(git ls-remote origin refs/heads/protection-probe | cut -f1)"
          echo "protection-probe before: $before"
          test -n "$before"
          out="$(git push origin --delete protection-probe 2>&1)"; rc=$?
          echo "$out"
          after="$(git ls-remote origin refs/heads/protection-probe | cut -f1)"
          echo "push exit: $rc | protection-probe after: $after"
          if [ "$rc" -ne 0 ] && [ "$after" = "$before" ] && echo "$out" | grep -q "repository rule violations"; then
            echo "RESULT: deletion REJECTED by repository rules"
          else
            echo "::error::deletion was NOT rejected by repository rules"
            exit 1
          fi
