# Phase 1 CI (ADR-0005 §5). One workflow, no workflow-level `paths` filters:
# every job runs on every PR and push to main. The final job `governance` is
# the single required status check; it fails unless every other job
# succeeded (skipped, cancelled and failed all fail), so adding a job here
# never needs a repository-settings change. tests/governance/test_workflow.py
# asserts that `needs` covers every job.
# Actions are pinned to commit SHAs (tags are mutable, review N-04).
name: governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: governance-${{ github.ref }}
  # Cancel superseded PR runs only; every push to main gets a completed run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.18"
  PYTHON_VERSION: "3.12"

jobs:
  governance-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret scan
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install governance tooling
        run: python -m pip install --require-hashes -r requirements-governance.txt
      - name: Governance check
        run: python -I scripts/check-governance.py
      - name: Task/handoff artifact check
        run: python -I scripts/check-artifacts.py
      - name: Governance tooling adversarial tests
        run: python -I -m unittest discover -s tests/governance -t . -v
      - name: Pre-commit (all files; branch guard skipped in CI)
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Secret scan (full history)
        run: scripts/secret-scan.sh
      - name: Repository protection matches TD-004
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I scripts/check-repo-protection.py

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install (strictly from uv.lock)
        run: uv sync --locked --python "${PYTHON_VERSION}"
      - name: Ruff lint
        run: .venv/bin/ruff check .
      - name: Ruff format
        run: .venv/bin/ruff format --check .
      - name: mypy --strict
        run: .venv/bin/mypy
      - name: Module boundaries (import-linter)
        run: .venv/bin/lint-imports
      - name: Unit tests
        run: .venv/bin/pytest tests/unit -q
      - name: Bandit
        run: .venv/bin/bandit -q -r src
      - name: Dependency audit (pip-audit, hashed lock export)
        run: |
          uv export --locked --format requirements-txt --no-emit-project -q > "${RUNNER_TEMP}/requirements-audit.txt"
          .venv/bin/pip-audit --strict --disable-pip --require-hashes -r "${RUNNER_TEMP}/requirements-audit.txt"

  backend-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install (strictly from uv.lock)
        run: uv sync --locked --python "${PYTHON_VERSION}"
      - name: Throwaway credentials (generated per run, masked)
        run: |
          for name in AO_PG_SUPERUSER_PASSWORD AO_PG_MIGRATION_PASSWORD AO_PG_APP_PASSWORD; do
            value="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done
      - name: Start PostgreSQL (roles via deploy/postgres/init) and Redis
        working-directory: .
        run: |
          # Values reach containers by variable name only (-e NAME), never on a command line.
          POSTGRES_PASSWORD="$AO_PG_SUPERUSER_PASSWORD" docker run -d --name ao-pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_PASSWORD -e AO_PG_MIGRATION_PASSWORD -e AO_PG_APP_PASSWORD -e AO_PG_DATABASE=observatory \
            -v "$PWD/deploy/postgres/init:/docker-entrypoint-initdb.d:ro" postgres:16.10-alpine
          docker run -d --name ao-redis -p 127.0.0.1:6379:6379 redis:7.4.11-alpine redis-server --save "" --appendonly no
          for _ in $(seq 60); do
            docker exec ao-pg pg_isready -q -h 127.0.0.1 -U postgres -d observatory \
              && [ "$(docker exec ao-redis redis-cli ping)" = PONG ] && exit 0
            sleep 1
          done
          docker logs ao-pg 2>&1 | tail -50; exit 1
      - name: Test service URLs
        run: |
          # Userinfo is passed as one argument so no credential-shaped URL appears in this file.
          url() { printf 'postgresql+psycopg://%s@127.0.0.1:5432/observatory' "$1"; }
          {
            echo "AO_TEST_DATABASE_URL=$(url "ao_app:${AO_PG_APP_PASSWORD}")"
            echo "AO_TEST_MIGRATION_DATABASE_URL=$(url "ao_migrator:${AO_PG_MIGRATION_PASSWORD}")"
            echo "AO_TEST_REDIS_URL=redis://127.0.0.1:6379/0"
          } >> "$GITHUB_ENV"
      - name: Alembic upgrade -> downgrade -> upgrade (migration role)
        env:
          AO_ENV: test
        run: |
          export AO_MIGRATION_DATABASE_URL="$AO_TEST_MIGRATION_DATABASE_URL"
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head
      - name: Exactly one Alembic head
        run: test "$(.venv/bin/alembic heads | wc -l)" -eq 1
      - name: All backend tests with real services + coverage floor (no silent skips)
        env:
          AO_REQUIRE_INTEGRATION: "1"
        run: .venv/bin/pytest -q --cov
      - name: Stop services
        if: always()
        working-directory: .
        run: docker rm -f ao-pg ao-redis || true

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Install (strictly from package-lock.json)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Format
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high
      - name: Registry signatures and provenance (ADR-0006)
        run: npm audit signatures

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Throwaway .env for compose (generated per run, masked)
        run: |
          umask 077
          echo "AO_ENV=dev" > .env
          for name in AO_PG_SUPERUSER_PASSWORD AO_PG_MIGRATION_PASSWORD AO_PG_APP_PASSWORD; do
            value="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> .env
          done
      - name: Validate compose file
        run: docker compose config -q
      - name: Build and start the stack (waits for every healthcheck)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test (health, readiness with real services, version, frontend headers)
        run: |
          curl -fsS http://127.0.0.1:8000/healthz
          ready="$(curl -fsS http://127.0.0.1:8000/readyz)"; echo "$ready"
          python3 -I -c 'import json,sys; b=json.loads(sys.argv[1]); assert b["status"]=="ready" and [c["name"] for c in b["checks"]]==["database","redis"], b' "$ready"
          curl -fsS http://127.0.0.1:8000/version
          headers="$(curl -fsSI http://127.0.0.1:3000/)"; echo "$headers"
          echo "$headers" | grep -qi '^content-security-policy:.*frame-ancestors .none.'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          if echo "$headers" | grep -qi '^x-powered-by'; then echo 'X-Powered-By present'; exit 1; fi
      - name: Containers run as non-root
        run: |
          for svc in backend frontend; do
            uid="$(docker compose exec -T "$svc" id -u)"; echo "$svc uid=$uid"; [ "$uid" != 0 ]
          done
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # Single required status check. Fails unless every job above succeeded.
  governance:
    if: always()
    needs: [governance-core, backend, backend-integration, frontend, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every required job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {job: v.get("result") for job, v in needs.items() if v.get("result") != "success"}
          for job, v in sorted(needs.items()):
              print(f"{job}: {v.get('result')}")
          if not needs or bad:
              print(f"FAIL: not successful: {bad or 'no jobs'}")
              sys.exit(1)
          print("OK: all required jobs succeeded")
          PY
